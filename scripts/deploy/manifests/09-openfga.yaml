apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-migrate
  namespace: envsync
spec:
  template:
    spec:
      containers:
        - name: openfga-migrate
          image: openfga/openfga:v1.12.0
          command: ["./openfga", "migrate"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              value: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
      restartPolicy: OnFailure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  namespace: envsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfga
  template:
    metadata:
      labels:
        app: openfga
    spec:
      containers:
        - name: openfga
          image: openfga/openfga:v1.12.0
          command: ["./openfga", "run"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              value: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
            - name: OPENFGA_HTTP_ADDR
              value: 0.0.0.0:8090
            - name: OPENFGA_GRPC_ADDR
              value: 0.0.0.0:8091
          ports:
            - containerPort: 8090
            - containerPort: 8091
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
  namespace: envsync
spec:
  selector:
    app: openfga
  ports:
    - name: http
      port: 8090
      targetPort: 8090
    - name: grpc
      port: 8091
      targetPort: 8091 