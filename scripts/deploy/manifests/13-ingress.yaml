apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: envsync-api
  namespace: envsync
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`PLACEHOLDER_API_DOMAIN`)
      kind: Rule
      services:
        - name: envsync-api
          port: 4000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: envsync-web
  namespace: envsync
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`PLACEHOLDER_APP_DOMAIN`)
      kind: Rule
      services:
        - name: envsync-web
          port: 5173
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: envsync-auth
  namespace: envsync
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`PLACEHOLDER_AUTH_DOMAIN`)
      kind: Rule
      services:
        - name: zitadel
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: envsync-s3
  namespace: envsync
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`PLACEHOLDER_S3_DOMAIN`)
      kind: Rule
      services:
        - name: rustfs
          port: 9000 