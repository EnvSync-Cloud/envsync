name: Deploy Frontend Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/envsync-web/**"
      - "apps/envsync-landing/**"
      - "packages/envsync-enterprise-web/**"
      - "sdks/**"
      - ".github/workflows/deploy-fe.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-web:
    name: Deploy envsync-web (Hosted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript SDK
        run: bun run --filter @envsync-cloud/envsync-ts-sdk build

      # Hosted SaaS must ship enterprise dashboard modules (integrations, license, sync).
      # Self-host OSS static images use build:oss via release.yml — do not change that path here.
      - name: Build Hosted web (enterprise modules)
        run: bun run --filter envsync-web build:hosted
        env:
          VITE_API_BASE_URL: ${{ secrets.ENVSYNC_API_URL }}
          VITE_SERVER_LICENSE: enterprise
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_OTEL_ENDPOINT: https://t.envsync.cloud/obs
          VITE_OTEL_SERVICE_NAME: envsync-web
          VITE_HYPERDX_URL: https://t.envsync.cloud/obs
          VITE_HYPERDX_API_KEY: ${{ secrets.ENVSYNC_HYPERDX_API_KEY }}
          VITE_HYPERDX_DISABLED: ${{ secrets.ENVSYNC_HYPERDX_DISABLED }}
          VITE_POSTHOG_KEY: ${{ secrets.ENVSYNC_POSTHOG_KEY }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ENVSYNC_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.ENVSYNC_POSTHOG_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ secrets.ENVSYNC_POSTHOG_UI_HOST }}
          VITE_POSTHOG_DISABLED: ${{ secrets.ENVSYNC_POSTHOG_DISABLED }}

      - name: Deploy to Cloudflare
        run: bun wrangler deploy
        working-directory: apps/envsync-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-landing:
    name: Deploy envsync-landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: bun run --filter @envsync-cloud/envsync-ts-sdk build

      - name: Build
        run: bun run --filter envsync-landing build
        env:
          VITE_API_BASE_URL: ${{ secrets.ENVSYNC_API_URL }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_OTEL_ENDPOINT: https://t.envsync.cloud/obs
          VITE_OTEL_SERVICE_NAME: envsync-landing
          VITE_HYPERDX_URL: https://t.envsync.cloud/obs
          VITE_HYPERDX_API_KEY: ${{ secrets.ENVSYNC_HYPERDX_API_KEY }}
          VITE_HYPERDX_DISABLED: ${{ secrets.ENVSYNC_HYPERDX_DISABLED }}
          VITE_POSTHOG_KEY: ${{ secrets.ENVSYNC_POSTHOG_KEY }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.ENVSYNC_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.ENVSYNC_POSTHOG_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ secrets.ENVSYNC_POSTHOG_UI_HOST }}
          VITE_POSTHOG_DISABLED: ${{ secrets.ENVSYNC_POSTHOG_DISABLED }}

      - name: Deploy to Cloudflare
        run: bun wrangler deploy
        working-directory: apps/envsync-landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
