# Keep the Deploy production tag dropdown on the newest release tags.
#
# GitHub choice inputs are a fixed list in deploy-production.yml. A tag push,
# including an rc, rewrites that list and pushes the commit to dev with the
# release GitHub App. The App needs contents write and workflows write.
# The release-bump gate skips the bot, so this commit does not cut another rc.

name: Refresh deploy tags

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: refresh-deploy-tags
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh tag dropdown
    runs-on: ubuntu-latest
    steps:
      - name: Require release app credentials
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_APP_ID}" ] || [ -z "${RELEASE_APP_PRIVATE_KEY}" ]; then
            echo "RELEASE_APP_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret) are required. The App needs contents write and workflows write on EnvSync-Cloud/envsync." >&2
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Rewrite the dropdown
        id: choices
        run: bun run scripts/sync-deploy-tag-choices.ts .github/workflows/deploy-production.yml

      - name: Commit and push
        if: steps.choices.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_name="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_name}" --jq .id)"
          bot_email="${bot_id}+${bot_name}@users.noreply.github.com"
          git add .github/workflows/deploy-production.yml
          git -c "user.name=${bot_name}" -c "user.email=${bot_email}" commit -m "chore: refresh production deploy tags"
          git push origin HEAD:dev
