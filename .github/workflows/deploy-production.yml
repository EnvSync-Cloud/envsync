# Deploy an already published stable tag to production.
#
# Run this workflow from dev. The tag dropdown is the newest stable tags.
# .github/workflows/sync-deploy-tag-choices.yml rewrites the list when a
# stable tag is pushed. The backup stops the stack until the archive finishes.
# Leave backup checked unless the archive itself is the problem.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to deploy
        required: true
        type: choice
        options:
          # BEGIN deploy-tag-options
          - v0.26.0
          - v0.25.3
          - v0.25.2
          - v0.25.1
          - v0.25.0
          - v0.24.0
          - v0.23.9
          - v0.23.8
          - v0.23.7
          - v0.23.6
          - v0.23.5
          - v0.23.4
          # END deploy-tag-options
      backup:
        description: Back up to Cloudflare R2 before upgrading. This stops the stack until the archive finishes.
        type: boolean
        default: true

run-name: Deploy production ${{ inputs.tag }}

permissions:
  contents: read
  actions: write

concurrency:
  group: production-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: production
      url: https://app.envsync.cloud
    steps:
      - uses: actions/checkout@v4

      - name: Require a published stable tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if ! printf '%s\n' "${RELEASE_TAG}" | grep -Eq "${pattern}"; then
            echo "Production deploy accepts a stable tag such as v0.26.0, not ${RELEASE_TAG}." >&2
            exit 1
          fi
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"

      - name: Prepare SSH key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_SSH_KEY" ]; then
            echo "Missing production secret PROD_SSH_KEY"
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/prod_ssh_key"
          printf '%s\n' "$PROD_SSH_KEY" > "$RUNNER_TEMP/prod_ssh_key"
          echo "PROD_SSH_KEY_FILE=$RUNNER_TEMP/prod_ssh_key" >> "$GITHUB_ENV"

      - name: Back up production to Cloudflare R2
        if: inputs.backup
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/production-backup-r2.sh

      - name: Upgrade production API
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/production-upgrade.sh

      - name: Deploy hosted frontend
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/production-deploy-frontend.sh
