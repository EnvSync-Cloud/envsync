# Deploy an already published release tag to production.
#
# Run this workflow from dev. Type the tag. GitHub draws the Run workflow
# form from this file before any job starts, so the form cannot call the API
# for a live dropdown. The job checks the tag with the GitHub API and rejects
# anything that is not vX.Y.Z or vX.Y.Z-rc.N.
# The backup stops the stack until the archive finishes. Leave backup checked
# unless the archive itself is the problem.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, such as v0.26.0 or v0.27.0-rc.1"
        required: true
        type: string
      backup:
        description: Back up to Cloudflare R2 before upgrading. This stops the stack until the archive finishes.
        type: boolean
        default: true

run-name: Deploy production ${{ inputs.tag }}

permissions:
  contents: read
  actions: write

concurrency:
  group: production-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: production
      url: https://app.envsync.cloud
    steps:
      - uses: actions/checkout@v4

      - name: Require a published release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$'
          if ! printf '%s\n' "${RELEASE_TAG}" | grep -Eq "${pattern}"; then
            echo "Production deploy accepts a tag such as v0.26.0 or v0.27.0-rc.1, not ${RELEASE_TAG}." >&2
            exit 1
          fi
          if ! gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}" --jq .ref >/dev/null; then
            echo "Tag ${RELEASE_TAG} is not in ${REPO}." >&2
            echo "Recent release tags:" >&2
            gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's#refs/tags/##' \
              | grep -E "${pattern}" \
              | sort -Vr \
              | head -n 20 >&2 || true
            exit 1
          fi
          echo "Deploying ${RELEASE_TAG}"

      - name: Prepare SSH key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_SSH_KEY" ]; then
            echo "Missing production secret PROD_SSH_KEY"
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/prod_ssh_key"
          printf '%s\n' "$PROD_SSH_KEY" > "$RUNNER_TEMP/prod_ssh_key"
          echo "PROD_SSH_KEY_FILE=$RUNNER_TEMP/prod_ssh_key" >> "$GITHUB_ENV"

      - name: Back up production to Cloudflare R2
        if: inputs.backup
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/production-backup-r2.sh

      - name: Upgrade production API
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/production-upgrade.sh

      - name: Deploy hosted frontend
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/production-deploy-frontend.sh
