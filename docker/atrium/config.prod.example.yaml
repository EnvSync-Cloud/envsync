# Example Atrium config for docker-compose.prod.yaml.
# Copy, replace every CHANGE_ME, and set ATRIUM_CONFIG_PATH to the copy.
# Do not mount docker/atrium/config.yaml in production: that file is for local Compose.
# ATRIUM_DB_PASSWORD and ATRIUM_MANAGEMENT_CLIENT_SECRET in .env must match this file.
server:
  host: 0.0.0.0
  port: 8080

database:
  driver: postgres
  dsn: postgres://atrium:CHANGE_ME_ATRIUM_DB_PASSWORD@atrium_db:5432/atrium?sslmode=disable
  migrations: true

security:
  issuer: https://auth.example.com
  login_identifier: username
  identifier_first: true
  access_token_format: jwt
  access_token_lifetime: 1h
  refresh_token_lifetime: 168h
  session_lifetime: 168h
  disable_registration: true
  disable_social_registration: true
  # Required. 32 bytes of standard base64. Generate a new value for each install.
  data_key: ""

registration:
  dcr_enabled: false
  cimd_enabled: false

management:
  client_id: management
  client_secret: CHANGE_ME_ATRIUM_MANAGEMENT_SECRET

smtp:
  enabled: true
  host: smtp.example.com
  port: 587
  username: CHANGE_ME
  password: CHANGE_ME
  from: noreply@example.com
  starttls: true
  implicit_tls: false

email:
  templates_dir: /branding/email

queue:
  type: memory

org:
  enabled: false

branding:
  product_name: EnvSync
  login_title: Welcome back
  username_label: Work email
  password_label: Password
  submit_label: Continue
  assets_dir: /branding/assets
  logo_file: logo.png
  favicon_file: logo.png
  primary_color: "#3ddc84"
  background_color: "#050507"
  text_color: "#f5f5f6"
  show_register: false
  show_forgot_password: true
  templates: /branding/templates
