server:
  host: 0.0.0.0
  port: 8080

database:
  driver: postgres
  dsn: postgres://atrium:atrium@atrium_db:5432/atrium?sslmode=disable
  migrations: true

security:
  issuer: http://auth.lvh.me:8080
  login_identifier: username
  identifier_first: true
  access_token_format: jwt
  access_token_lifetime: 1h
  refresh_token_lifetime: 168h
  session_lifetime: 168h
  disable_registration: true
  disable_social_registration: true
  hash_algo: internal/hashalgo/algo.go

registration:
  dcr_enabled: false
  cimd_enabled: false

management:
  client_id: management
  client_secret: replace-me-management

smtp:
  enabled: true
  host: mailpit
  port: 1025
  from: atrium@envsync.local
  starttls: false
  implicit_tls: false

email:
  templates_dir: /branding/email

queue:
  type: memory

org:
  enabled: false

branding:
  product_name: EnvSync
  login_title: Welcome back
  username_label: Work email
  password_label: Password
  submit_label: Continue
  assets_dir: /branding/assets
  logo_file: logo.png
  favicon_file: logo.png
  primary_color: "#3ddc84"
  background_color: "#050507"
  text_color: "#f5f5f6"
  show_register: false
  show_forgot_password: true
  templates: /branding/templates
