{{template "head" .}}
    <h1>Choose a new password</h1>
    <p class="sub">Set a password for {{.Brand.ProductName}} before continuing.</p>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="/login/migrate/password">
        {{template "oauth_fields" .}}
        <div class="field">
            <label for="password">New password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" required autofocus>
        </div>
        <div class="field">
            <label for="password_confirm">Confirm password</label>
            <input class="input" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
            <p class="help">Use at least 8 characters.</p>
        </div>
        <button class="primary" type="submit">Update password</button>
    </form>
{{template "card_close" .}}
{{template "brand_footer" .}}
