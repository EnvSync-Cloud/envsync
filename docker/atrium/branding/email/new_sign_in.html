<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New sign-in to EnvSync</title>
  <style>
body { margin: 0; background: #050507; color: #f5f5f6; font-family: Inter, "Segoe UI", sans-serif; }
.wrap { padding: 32px 16px; }
.card { max-width: 560px; margin: 0 auto; background: #121216; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; overflow: hidden; }
.body { padding: 28px 32px 32px; }
.brand img { width: 52px; height: 52px; border-radius: 14px; }
.eyebrow { margin: 16px 0 8px; color: #3ddc84; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; }
h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
p { color: #d4d4d8; margin: 0 0 12px; line-height: 1.5; }
.panel { margin: 8px 0 18px; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; }
.panel div { padding: 12px 14px; border-top: 1px solid #26262e; font-size: 14px; }
.panel div:first-child { border-top: 0; }
.panel span { color: #a1a1aa; display: inline-block; min-width: 92px; }
.code { margin: 8px 0 18px; font-size: 32px; letter-spacing: 0.28em; font-weight: 700; color: #f5f5f6; }
.cta { display: inline-block; margin: 6px 0 8px; padding: 12px 22px; border-radius: 999px; background: #3ddc84; color: #04210f; font-weight: 700; text-decoration: none; }
.fine { color: #71717a; font-size: 12.5px; }
footer { padding: 16px 32px 22px; border-top: 1px solid rgba(255,255,255,0.08); color: #71717a; font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap"><article class="card">
    <div class="body">
      <div class="brand"><img src="{{.Issuer}}/branding/assets/logo.png" width="52" height="52" alt="EnvSync"></div>
      <p class="eyebrow">ENVSYNC</p>
      
      <h1>New sign-in to EnvSync</h1>
      <p>Your account was used to sign in. If this was you, you're done.</p>
      <div class="panel">
        <div><span>Account</span><strong>{{.Username}}</strong></div>
        <div><span>Time</span><strong>{{.Time}}</strong></div>
        <div><span>IP address</span><strong>{{.IP}}</strong></div>
      </div>
      <p><a class="cta" href="{{.Issuer}}/forgot">Secure my account</a></p>
      <p class="fine">We send this at most once every 10 minutes.</p>

    </div>
    <footer>EnvSync<br>You received this because it concerns your account.</footer>
  </article></div>
</body>
</html>
